<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#18182E" />
      <stop offset="50%" stop-color="#0E0E18" />
      <stop offset="100%" stop-color="#07070B" />
    </radialGradient>

    <!-- Neon Glow Behind Glass -->
    <radialGradient id="ambientGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#C6FF3D" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#C6FF3D" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Beer Liquid Gradient -->
    <linearGradient id="beerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="25%" stop-color="#FFC82C" />
      <stop offset="70%" stop-color="#FF9E0D" />
      <stop offset="100%" stop-color="#E36A00" />
    </linearGradient>

    <!-- Glass Rim & Neon Outline Gradient -->
    <linearGradient id="neonLimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FF80" />
      <stop offset="100%" stop-color="#9EEB00" />
    </linearGradient>

    <!-- Foam Gradient -->
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Sparkle Pink Gradient -->
    <linearGradient id="sparkPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6BB5" />
      <stop offset="50%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#D6006E" />
    </linearGradient>

    <!-- Neon Filter -->
    <filter id="glowLime" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#C6FF3D" stroke-opacity="0.22" stroke-width="4" />

  <!-- Ambient Glow Behind Glass -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#ambientGlow)" />

  <!-- Beer Glass Base Shadow & Mug Group -->
  <g filter="url(#softShadow)" transform="translate(-10, 0)">

    <!-- Mug Handle -->
    <path d="M315 220 C365 220 395 240 395 275 C395 315 365 345 315 345" 
          fill="none" 
          stroke="url(#neonLimeGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowLime)" />

    <!-- Glass Interior Body Backing -->
    <path d="M170 185 L186 375 C188 395 204 410 225 410 H275 C296 410 312 395 314 375 L330 185 Z" 
          fill="#131322" />

    <!-- Beer Liquid Body -->
    <path d="M173 205 L187 372 C188 388 202 400 218 400 H282 C298 400 312 388 313 372 L327 205 Z" 
          fill="url(#beerGrad)" />

    <!-- Beer Liquid Top Wave / Surface -->
    <ellipse cx="250" cy="205" rx="77" ry="12" fill="#FFE566" />

    <!-- Stein Facet Highlights (Vertical Glass Reflections) -->
    <path d="M205 220 L213 385" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round" />
    <path d="M250 220 L250 390" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" />
    <path d="M295 220 L287 385" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8" stroke-linecap="round" />

    <!-- Rising Bubbles -->
    <circle cx="225" cy="355" r="5" fill="#FFFFFF" fill-opacity="0.6" />
    <circle cx="270" cy="335" r="7" fill="#FFFFFF" fill-opacity="0.55" />
    <circle cx="238" cy="295" r="6" fill="#FFFFFF" fill-opacity="0.5" />
    <circle cx="282" cy="265" r="4.5" fill="#FFFFFF" fill-opacity="0.6" />
    <circle cx="218" cy="245" r="5.5" fill="#FFFFFF" fill-opacity="0.5" />
    <circle cx="260" cy="225" r="4" fill="#FFFFFF" fill-opacity="0.7" />

    <!-- Outer Glass Neon Frame -->
    <path d="M168 185 L184 375 C186 397 203 412 225 412 H275 C297 412 314 397 316 375 L332 185" 
          fill="none" 
          stroke="url(#neonLimeGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowLime)" />

    <!-- Heavy Mug Base Rim -->
    <path d="M198 412 H302" 
          stroke="url(#neonLimeGrad)" 
          stroke-width="22" 
          stroke-linecap="round"
          filter="url(#glowLime)" />

    <!-- Creamy Foam Head (Clouds) -->
    <g>
      <!-- Base froth silhouette -->
      <path d="M150 185 C146 168 160 148 180 148 C186 148 193 151 198 155 C206 138 225 125 248 125 C272 125 292 138 300 156 C306 151 314 148 322 148 C342 148 356 166 352 185 C350 197 340 206 328 206 H172 C160 206 151 197 150 185 Z" 
            fill="url(#foamGrad)" />

      <!-- Natural Foam Drip Running Down Front -->
      <path d="M172 195 Q172 232 184 232 Q196 232 196 195 Z" 
            fill="#FFFFFF" />

      <!-- Secondary soft froth bubble -->
      <path d="M298 195 Q298 220 307 220 Q316 220 316 195 Z" 
            fill="#FFFFFF" />

      <!-- Foam Texture & Highlights -->
      <ellipse cx="248" cy="142" rx="28" ry="12" fill="#FFFFFF" fill-opacity="0.8" />
      <ellipse cx="195" cy="160" rx="16" ry="8" fill="#FFFFFF" fill-opacity="0.7" />
      <ellipse cx="320" cy="162" rx="14" ry="7" fill="#FFFFFF" fill-opacity="0.7" />
    </g>
  </g>

  <!-- Big Neon Pink Star (Top Right) -->
  <g transform="translate(390, 115)" filter="url(#glowPink)">
    <path d="M0 -38 Q5 -5 38 0 Q5 5 0 38 Q-5 5 -38 0 Q-5 -5 0 -38 Z" fill="url(#sparkPink)" />
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>

  <!-- Subtle Neon Pink Sparkle (Left) -->
  <g transform="translate(100, 260)" filter="url(#glowPink)">
    <path d="M0 -20 Q3 -3 20 0 Q3 3 0 20 Q-3 3 -20 0 Q-3 -3 0 -20 Z" fill="url(#sparkPink)" opacity="0.85" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Tiny Neon Lime Sparkle (Top Left) -->
  <g transform="translate(140, 95)" filter="url(#glowLime)">
    <path d="M0 -15 Q2 -2 15 0 Q2 2 0 15 Q-2 2 -15 0 Q-2 -2 0 -15 Z" fill="#C6FF3D" opacity="0.9" />
  </g>
</svg>